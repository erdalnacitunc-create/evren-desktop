name: Linux build (Pardus)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayına eklenecek sürüm etiketi (örn. v0.3.0-beta.1). Boşsa yalnızca artifact üretilir.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Pardus / Debian x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Type check
        run: npm run typecheck

      - name: Build Linux packages
        run: npm run build:linux

      - name: Checksums
        run: |
          cd release
          sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evren-desktop-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            release/*.deb \
            release/*.AppImage \
            release/SHA256SUMS-linux.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
