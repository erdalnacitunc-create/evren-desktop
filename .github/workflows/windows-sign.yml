name: Windows test signing

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-windows-installer:
    name: Build and test-sign Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Locate unsigned installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'EVREN-Desktop-Setup-*-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'Unsigned installer not found' }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Get-Item $exe.FullName | Select-Object Name, Length

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: evren-desktop-unsigned-installer
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Submit SignPath signing request (REST API)
        id: sign
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $organizationId = '1c01d4c4-0b07-4fce-bc03-eaf4f31c9145'
          $baseUrl = "https://app.signpath.io/Api/v1/$organizationId"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $installerPath = '${{ steps.installer.outputs.path }}'

          $form = @{
            projectSlug = 'evren-desktop'
            signingPolicySlug = 'test-signing'
            artifact = Get-Item $installerPath
            description = "GitHub Actions $env:GITHUB_RUN_ID / $env:GITHUB_SHA"
          }

          $response = Invoke-WebRequest `
            -Uri "$baseUrl/SigningRequests/SubmitWithArtifact" `
            -Method Post `
            -Headers $headers `
            -Form $form

          $location = [string]$response.Headers.Location
          if (-not $location) {
            $payload = $response.Content | ConvertFrom-Json
            $location = "$baseUrl/SigningRequests/$($payload.signingRequestId)"
          }
          if (-not $location) { throw 'SignPath did not return a signing request location' }

          $signingRequestId = ($location.TrimEnd('/') -split '/')[-1]
          "Signing request: $signingRequestId"
          "Location: $location"

          $deadline = (Get-Date).AddMinutes(15)
          do {
            Start-Sleep -Seconds 5
            $status = Invoke-RestMethod -Uri "$baseUrl/SigningRequests/$signingRequestId" -Headers $headers
            "Status: $($status.status) / $($status.workflowStatus)"
            if ((Get-Date) -gt $deadline) { throw 'Signing request timed out' }
          } while (-not $status.isFinalStatus)

          if ($status.status -ne 'Completed') {
            throw "SignPath signing failed: $($status.status) / $($status.workflowStatus)"
          }

          New-Item -ItemType Directory -Force -Path signed | Out-Null
          $signedName = Split-Path $installerPath -Leaf
          Invoke-WebRequest `
            -Uri "$baseUrl/SigningRequests/$signingRequestId/SignedArtifact" `
            -Headers $headers `
            -OutFile "signed/$signedName"

          "signing-request-id=$signingRequestId" >> $env:GITHUB_OUTPUT
          "signed-path=signed/$signedName" >> $env:GITHUB_OUTPUT

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Signed installer not found' }

          $sig = Get-AuthenticodeSignature $exe.FullName
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          "Signed file: $($exe.Name)"
          "SHA256: $hash"
          "Signature status: $($sig.Status)"
          "Signer subject: $($sig.SignerCertificate.Subject)"

          if (-not $sig.SignerCertificate) {
            throw 'SignPath returned a file without a signer certificate'
          }

          $summary = @(
            '## SignPath test signing result',
            '',
            "- File: ``$($exe.Name)``",
            "- SHA256: ``$hash``",
            "- Signature status: ``$($sig.Status)``",
            "- Signer subject: ``$($sig.SignerCertificate.Subject)``",
            '',
            '> This is a self-signed test certificate. `UnknownError` / `UntrustedRoot` is expected.',
            '> Do not publish this artifact as a trusted release.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          name: evren-desktop-test-signed-installer
          path: signed
          if-no-files-found: error
